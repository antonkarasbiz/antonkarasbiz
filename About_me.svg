      .panel{fill:url(#panel);stroke:#2b3136;stroke-width:1.5}.heading{fill:#ff8a00;font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700;letter-spacing:.5px}.body{fill:#ededed;font-family:Arial,Helvetica,sans-serif;font-size:21px}.label{fill:#ededed;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700}.value{fill:#bfc2c5;font-family:Arial,Helvetica,sans-serif;font-size:17px}.tag{fill:#2a3035;stroke:#343b41;stroke-width:1}.tagText{fill:#f1f1f1;font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:600}.socialTitle{fill:#f2f2f2;font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:700}.socialSub{fill:#65a0ff;font-family:Arial,Helvetica,sans-serif;font-size:15px}.socialCard{fill:#20262b;stroke:#343b41;stroke-width:1.2;cursor:pointer}.socialCard:hover{fill:#2b3238;stroke:#ff8a00;stroke-width:2}.socialCard:hover .socialSub{fill:#ff9f2f}.socialCard:hover .iconStroke{stroke:#ff8a00}.socialCard:hover .iconFill{fill:#ff8a00}.skillHead{fill:#ededed;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700}.skillNote{fill:#9fa5aa;font-family:Arial,Helvetica,sans-serif;font-size:15px}
